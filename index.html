<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦀 紅蟳養肥計畫</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c0392b;
    --red-bright: #e74c3c;
    --red-light: #ff8c78;
    --red-dark: #7b1a10;
    --orange: #e67e22;
    --bg: #090604;
    --surface: #120908;
    --surface2: #1c0e0a;
    --text: #f5ede8;
    --text-muted: #7a5a50;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 45% at 50% -5%, rgba(192,57,43,0.2) 0%, transparent 65%),
      radial-gradient(ellipse 40% 35% at 85% 85%, rgba(26,122,110,0.07) 0%, transparent 55%);
    pointer-events: none; z-index: 0;
  }

  .container { position: relative; z-index: 1; width: 100%; max-width: 540px; }

  /* Header */
  header { text-align: center; margin-bottom: 40px; }

  .crab {
    font-size: 64px; display: block; margin-bottom: 10px;
    opacity: 0; animation: dropIn 0.7s 0.1s cubic-bezier(0.34,1.56,0.64,1) forwards;
    filter: drop-shadow(0 6px 20px rgba(192,57,43,0.55));
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 5px; text-transform: uppercase;
    color: var(--red-light); margin-bottom: 10px;
    opacity: 0; animation: fadeUp 0.5s 0.4s ease forwards;
  }
  h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(2rem,7vw,3rem); font-weight: 900; line-height: 1.2;
    opacity: 0; animation: fadeUp 0.5s 0.5s ease forwards;
  }
  h1 em { color: var(--red-bright); font-style: normal; }
  .sub {
    margin-top: 10px; font-size: 13px; color: var(--text-muted); line-height: 1.7;
    opacity: 0; animation: fadeUp 0.5s 0.6s ease forwards;
  }

  /* Total card */
  .total-card {
    background: var(--surface);
    border: 1px solid rgba(192,57,43,0.22);
    border-radius: 22px; padding: 32px 28px 28px;
    text-align: center; margin-bottom: 20px;
    position: relative; overflow: hidden;
    opacity: 0; animation: fadeUp 0.5s 0.7s ease forwards;
  }
  .total-card::before {
    content: ''; position: absolute; top:0; left:0; right:0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--red-bright), var(--orange), transparent);
  }
  .total-card::after {
    content: '🦀'; position: absolute; right: -8px; bottom: -18px;
    font-size: 100px; opacity: 0.04; transform: rotate(-12deg); pointer-events: none;
  }

  .total-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }

  .total-amount {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(3rem,11vw,5rem); font-weight: 900;
    color: var(--red-light); line-height: 1;
  }
  .total-amount.bump { animation: bump 0.4s ease; }
  .currency { font-size: 0.38em; vertical-align: super; color: var(--red-bright); font-weight: 400; }

  .donor-count { margin-top: 12px; font-size: 13px; color: var(--text-muted); }
  .donor-count b { color: var(--red-light); }

  .goal-wrap { margin-top: 22px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
  .goal-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .goal-meta b { color: var(--red-light); }
  .track { height: 8px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
  .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red-dark), var(--red-bright), var(--orange));
    border-radius: 99px; width: 0%;
    transition: width 0.9s cubic-bezier(0.34,1.1,0.64,1);
  }
  .goal-done { margin-top: 12px; font-size: 13px; color: #4ade80; display: none; }

  /* Input card */
  .input-card {
    background: var(--surface); border: 1px solid rgba(255,255,255,0.05);
    border-radius: 22px; padding: 26px 24px; margin-bottom: 20px;
    opacity: 0; animation: fadeUp 0.5s 0.8s ease forwards;
  }
  .section-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 18px; }

  .row { display: flex; gap: 12px; margin-bottom: 14px; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }

  input {
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px; padding: 13px 15px; color: var(--text);
    font-family: 'Noto Sans TC', sans-serif; font-size: 15px;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s; width: 100%;
  }
  input:focus { border-color: var(--red-bright); box-shadow: 0 0 0 3px rgba(192,57,43,0.15); }
  input::placeholder { color: var(--text-muted); }
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  .quick { display: flex; gap: 8px; margin-bottom: 14px; }
  .q-btn {
    flex: 1; padding: 9px 4px; background: var(--surface2);
    border: 1px solid rgba(192,57,43,0.2); border-radius: 8px;
    color: var(--red-light); font-size: 13px; cursor: pointer;
    transition: all 0.15s; font-family: 'Noto Sans TC', sans-serif;
  }
  .q-btn:hover { background: rgba(192,57,43,0.14); border-color: var(--red-bright); }

  .submit-btn {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--red-dark), var(--red-bright) 60%, var(--orange));
    color: #fff; font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px; font-weight: 500; letter-spacing: 1px; cursor: pointer;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(192,57,43,0.35);
  }
  .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 28px rgba(192,57,43,0.45); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Feed */
  .feed-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; opacity: 0; animation: fadeUp 0.5s 0.9s ease forwards;
  }
  .feed-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); }
  .live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #4ade80; letter-spacing: 1px; }
  .live::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 8px #4ade80; animation: blink 2s infinite;
  }

  .feed { display: flex; flex-direction: column; gap: 10px; opacity: 0; animation: fadeUp 0.5s 1s ease forwards; }

  .feed-item {
    background: var(--surface); border: 1px solid rgba(255,255,255,0.04);
    border-radius: 14px; padding: 15px 18px;
    display: flex; align-items: center; justify-content: space-between;
    animation: slideIn 0.35s ease;
  }
  .feed-item.new { border-color: rgba(192,57,43,0.38); background: rgba(192,57,43,0.07); }

  .feed-left { display: flex; align-items: center; gap: 13px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; flex-shrink: 0;
    font-family: 'Noto Serif TC', serif;
  }
  .feed-name { font-size: 14px; font-weight: 500; }
  .feed-time { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .feed-amt { font-family: 'Noto Serif TC', serif; font-size: 19px; font-weight: 700; color: var(--red-light); }

  .empty { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 14px; line-height: 2.2; }

  /* Status bar */
  .status {
    margin-top: 20px; padding: 12px 16px; border-radius: 10px;
    font-size: 12px; text-align: center; line-height: 1.6;
    background: rgba(74,222,128,0.07); border: 1px solid rgba(74,222,128,0.2);
    color: #4ade80; opacity: 0; animation: fadeUp 0.5s 1.1s ease forwards;
  }
  .status.error { background: rgba(231,76,60,0.07); border-color: rgba(231,76,60,0.2); color: var(--red-light); }
  .status.loading { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); color: var(--text-muted); }

  /* Animations */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes dropIn {
    from { opacity:0; transform:translateY(-28px) scale(0.5); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes slideIn {
    from { opacity:0; transform:translateX(-10px); }
    to   { opacity:1; transform:translateX(0); }
  }
  @keyframes bump {
    0%  { transform:scale(1); }
    40% { transform:scale(1.08); }
    100%{ transform:scale(1); }
  }
  @keyframes blink {
    0%,100%{ opacity:1; } 50%{ opacity:0.2; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <span class="crab">🦀</span>
    <p class="eyebrow">集資贊助計畫</p>
    <h1>紅蟳<em>養肥</em>計畫</h1>
    <p class="sub">一起把紅蟳養得肥肥壯壯！<br>每一份贊助都讓牠們更鮮美 🌊</p>
  </header>

  <!-- 累計金額 -->
  <div class="total-card">
    <div class="total-label">累計贊助金額</div>
    <div class="total-amount" id="totalEl">
      <span class="currency">NT$</span><span id="amountNum">0</span>
    </div>
    <div class="donor-count">共 <b id="donorCount">0</b> 位贊助者加入</div>
    <div class="goal-wrap">
      <div class="goal-meta">
        <span>目標進度</span>
        <b id="goalPct">0%／NT$20,000</b>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="goal-done" id="goalDone">🎉 目標達成！感謝所有人支持紅蟳！</div>
    </div>
  </div>

  <!-- 輸入 -->
  <div class="input-card">
    <div class="section-label">加入贊助</div>
    <div class="row">
      <div class="field">
        <label>你的名字</label>
        <input type="text" id="nameInput" placeholder="輸入暱稱" maxlength="20">
      </div>
      <div class="field" style="flex:0.75">
        <label>金額（NT$）</label>
        <input type="number" id="amountInput" placeholder="500" min="1">
      </div>
    </div>
    <div class="quick">
      <button class="q-btn" onclick="setAmt(200)">$200</button>
      <button class="q-btn" onclick="setAmt(500)">$500</button>
      <button class="q-btn" onclick="setAmt(1000)">$1,000</button>
      <button class="q-btn" onclick="setAmt(3000)">$3,000</button>
    </div>
    <button class="submit-btn" id="submitBtn" onclick="addDonation()">🦀 餵食</button>
  </div>

  <!-- 贊助紀錄 -->
  <div class="feed-header">
    <span class="feed-label">餵食紀錄</span>
    <span class="live">LIVE</span>
  </div>
  <div class="feed" id="feed">
    <div class="empty">⏳ 連線中...</div>
  </div>

  <div class="status loading" id="status">🔌 正在連接 Firebase 即時資料庫...</div>

</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqC0aorzFep-JG3fOkREbwgQsHoKnWdb8",
    authDomain: "crabfarming-1e081.firebaseapp.com",
    databaseURL: "https://crabfarming-1e081-default-rtdb.firebaseio.com",
    projectId: "crabfarming-1e081",
    storageBucket: "crabfarming-1e081.firebasestorage.app",
    messagingSenderId: "23204458481",
    appId: "1:23204458481:web:42eca54c6900e55d4bde50",
    measurementId: "G-71VQW6R2W0"
  };

  const GOAL = 20000;
  const COLORS = [
    ['#c0392b','#ffe8e5'], ['#e67e22','#fff3e5'], ['#1a7a6e','#e5fff8'],
    ['#8e44ad','#f3e5ff'], ['#2471a3','#e5f3ff'], ['#b7950b','#fff9e5'],
  ];

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const donationsRef = ref(db, 'donations');

  let prevTotal = 0;

  // 即時監聽資料庫變化
  onValue(donationsRef, (snapshot) => {
    const data = snapshot.val();
    const donations = data
      ? Object.entries(data)
          .map(([id, d]) => ({ id, ...d }))
          .sort((a, b) => b.timestamp - a.timestamp)
      : [];

    const total = donations.reduce((s, d) => s + d.amount, 0);

    renderTotal(total, donations.length, prevTotal);
    renderFeed(donations);
    prevTotal = total;

    document.getElementById('status').className = 'status';
    document.getElementById('status').textContent = '✅ 已連接 Firebase，資料即時同步中';
  }, (error) => {
    document.getElementById('status').className = 'status error';
    document.getElementById('status').textContent = '❌ 連線失敗：' + error.message;
    document.getElementById('feed').innerHTML =
      '<div class="empty">連線失敗，請確認 Realtime Database 已開啟測試模式</div>';
  });

  // 送出贊助
  window.addDonation = async function() {
    const name = document.getElementById('nameInput').value.trim();
    const amount = parseInt(document.getElementById('amountInput').value);
    if (!name)             { shake('nameInput');   return; }
    if (!amount || amount < 1) { shake('amountInput'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '送出中...';

    try {
      await push(donationsRef, {
        name,
        amount,
        timestamp: serverTimestamp()
      });
      document.getElementById('nameInput').value = '';
      document.getElementById('amountInput').value = '';
      document.getElementById('nameInput').focus();
    } catch (e) {
      alert('送出失敗：' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '🦀 送出贊助';
    }
  };

  window.setAmt = function(n) {
    document.getElementById('amountInput').value = n;
    document.getElementById('amountInput').focus();
  };

  document.getElementById('amountInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.addDonation();
  });

  function renderTotal(total, count, prev) {
    const numEl = document.getElementById('amountNum');
    const start = prev;
    const t0 = performance.now();
    (function tick(now) {
      const p = Math.min((now - t0) / 700, 1);
      const e = 1 - Math.pow(1 - p, 3);
      numEl.textContent = Math.round(start + (total - start) * e).toLocaleString();
      if (p < 1) requestAnimationFrame(tick);
    })(t0);

    if (total !== prev) {
      const el = document.getElementById('totalEl');
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }

    document.getElementById('donorCount').textContent = count;

    const pct = Math.min(total / GOAL * 100, 100);
    document.getElementById('fill').style.width = pct + '%';
    document.getElementById('goalPct').textContent =
      Math.floor(pct) + '%／NT$' + GOAL.toLocaleString();

    document.getElementById('goalDone').style.display = total >= GOAL ? 'block' : 'none';
  }

  function renderFeed(donations) {
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    if (!donations.length) {
      feed.innerHTML = '<div class="empty">🦀 還沒有人贊助<br>成為第一位贊助者吧！</div>';
      return;
    }

    donations.forEach((d) => {
      const c = COLORS[(d.name || '?').charCodeAt(0) % COLORS.length];
      const time = d.timestamp
        ? new Date(d.timestamp).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' })
        : '--:--';
      const el = document.createElement('div');
      el.className = 'feed-item';
      el.innerHTML = `
        <div class="feed-left">
          <div class="avatar" style="background:${c[0]};color:${c[1]}">${esc(d.name[0])}</div>
          <div>
            <div class="feed-name">${esc(d.name)}</div>
            <div class="feed-time">${time}</div>
          </div>
        </div>
        <div class="feed-amt">NT$ ${Number(d.amount).toLocaleString()}</div>
      `;
      feed.appendChild(el);
    });
  }

  function shake(id) {
    const el = document.getElementById(id);
    el.style.borderColor = '#e74c3c';
    el.style.boxShadow = '0 0 0 3px rgba(231,76,60,0.25)';
    setTimeout(() => { el.style.borderColor=''; el.style.boxShadow=''; }, 800);
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
